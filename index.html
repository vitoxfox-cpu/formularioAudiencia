<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Hello World Excel</title>
  <!-- ✅ URL CORRETA do Office.js -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body style="font-family: sans-serif; padding: 16px;">
  <h2>Hello World!</h2>
  <p>O suplemento carregou no Excel Online.</p>
  <button id="btn" style="padding: 8px 12px;">Testar Célula A1</button>
  <p id="msg"></p>

  <script>
    Office.onReady(() => {
      document.getElementById("btn").onclick = async () => {
        await Excel.run(async (context) => {
          const sheet = context.workbook.worksheets.getActiveWorksheet();
          sheet.getRange("A1").values = [["Hello World!"]];
          await context.sync();
          document.getElementById("msg").innerText = "Escrito em A1!";
        });
      };
    });
  </script>
</body>
</html>
